name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "aquapool/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "aquapool/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: aquapool

jobs:
  quality:
    name: Install, type-check, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aquapool_test
          POSTGRES_USER: aquapool
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquapool -d aquapool_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: aquapool/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://aquapool:password@localhost:5432/aquapool_test

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:3005/ws
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: test

      - name: Run tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://aquapool:password@localhost:5432/aquapool_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-do-not-use-in-production
          NODE_ENV: test

  e2e:
    name: Web end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: aquapool/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: aquapool/apps/web

      - name: Build web application
        run: npx turbo run build --filter=@aquapool/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:3005/ws
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: test

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: aquapool/apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: aquapool/apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
